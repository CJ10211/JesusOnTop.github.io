name: Playwright Smoke Test

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Playwright browsers and system deps
        run: |
          npx playwright install --with-deps

      - name: Start static server
        run: |
          nohup python3 -m http.server 8000 > server.log 2>&1 &
          sleep 2

      - name: Run smoke test
        run: |
          FILE=$(find "$GITHUB_WORKSPACE" -type f -name smoke_cookie.py | head -n1)
          if [ -z "$FILE" ]; then
            echo "smoke_cookie.py not found in workspace:" $GITHUB_WORKSPACE
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type d -print
            exit 2
          fi
          echo "Running test file:" "$FILE"
          python3 "$FILE"
        env:
          CI: true
