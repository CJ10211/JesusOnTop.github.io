<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing Master</title><style>body{font-family:Arial;max-width:600px;margin:20px auto;padding:16px;background:#1e1e1e;color:#fff;text-align:center}#text{font-size:20px;font-family:monospace;background:#000;padding:20px;border-radius:4px;letter-spacing:2px;margin:20px 0}input{width:100%;padding:10px;font-size:16px;border:2px solid #0366d6;border-radius:4px}#stats{margin:20px;font-size:18px}</style></head><body><h1>Typing Master</h1><p>Type the text as fast as you can!</p><div id="text">The quick brown fox jumps over the lazy dog</div><input type="text" id="input" placeholder="Start typing..."><div id="stats">WPM: 0 | Accuracy: 100%</div><button onclick="reset()">Reset</button><p><a href="index.html" style="color:#64b5f6">Back</a></p><script>const target='The quick brown fox jumps over the lazy dog';let start=0;const inp=document.getElementById('input');inp.addEventListener('input',()=>{if(start===0)start=Date.now();let typed=inp.value;let correct=0;for(let i=0;i<Math.min(typed.length,target.length);i++){if(typed[i]===target[i])correct++}let acc=Math.round((correct/target.length)*100);let time=(Date.now()-start)/60000;let wpm=Math.round((typed.length/5)/time)||0;document.getElementById('stats').innerHTML=`WPM: ${wpm} | Accuracy: ${acc}%`});function reset(){inp.value='';start=0;document.getElementById('stats').innerHTML='WPM: 0 | Accuracy: 100%'}</script></body></html>
