<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simon Says</title><style>body{font-family:Arial;text-align:center;background:#222;color:#fff;padding:20px}canvas{display:block;margin:20px auto;border:4px solid #333;background:#000}button{padding:10px 20px;background:#0366d6;color:#fff;border:0;border-radius:4px;cursor:pointer;font-size:16px}</style></head><body><h1>Simon Says</h1><p>Watch the pattern and repeat!</p><canvas id="c" width="400" height="400"></canvas><button onclick="startGame()">Start Game</button><p>Level: <span id="level">0</span></p><p><a href="index.html" style="color:#64b5f6">Back</a></p><script>const c=document.getElementById('c');const x=c.getContext('2d');const colors=['#ff0000','#00ff00','#0000ff','#ffff00'];const buttons=[{x:0,y:0,w:200,h:200,color:colors[0]},{x:200,y:0,w:200,h:200,color:colors[1]},{x:0,y:200,w:200,h:200,color:colors[2]},{x:200,y:200,w:200,h:200,color:colors[3]}];let sequence=[],playerSequence=[],gameActive=false;function startGame(){sequence=[];playerSequence=[];gameActive=true;nextRound();}function nextRound(){playerSequence=[];const idx=Math.floor(Math.random()*4);sequence.push(idx);document.getElementById('level').textContent=sequence.length;playSequence();}function playSequence(){let i=0;function playNext(){if(i<sequence.length){const idx=sequence[i];flashButton(idx);i++;setTimeout(playNext,600)}else{gameActive=true;setupPlayerInput()}}playNext()}function flashButton(idx){const btn=buttons[idx];x.fillStyle=btn.color;x.fillRect(btn.x,btn.y,btn.w,btn.h);setTimeout(()=>draw(),200);}function setupPlayerInput(){c.addEventListener('click',handleClick)}function handleClick(e){if(!gameActive)return;const r=c.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;for(let i=0;i<buttons.length;i++){const b=buttons[i];if(px>b.x&&px<b.x+b.w&&py>b.y&&py<b.y+b.h){flashButton(i);playerSequence.push(i);if(playerSequence[playerSequence.length-1]!==sequence[playerSequence.length-1]){alert('Game Over!');startGame();return}if(playerSequence.length===sequence.length){gameActive=false;setTimeout(nextRound,1000)}}}}function draw(){x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);for(let b of buttons){x.fillStyle=b.color;x.fillRect(b.x,b.y,b.w,b.h);x.strokeStyle='#333';x.lineWidth=2;x.strokeRect(b.x,b.y,b.w,b.h)}}draw();</script></body></html>
