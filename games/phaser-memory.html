<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match</title><style>body{margin:0;padding:20px;background:#2c3e50;color:#fff;font-family:Arial;text-align:center}#container{max-width:600px;margin:0 auto}h1{color:#3498db}#info{font-size:18px;margin:20px 0}#grid{display:grid;grid-template-columns:repeat(4,100px);grid-template-rows:repeat(4,100px);gap:10px;justify-content:center;margin:20px 0}.card{width:100px;height:100px;background:#3498db;border:3px solid #2c3e50;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:40px;transition:all 0.3s;user-select:none;box-shadow:0 4px 6px rgba(0,0,0,0.2)}.card:hover{transform:scale(1.05)}.card.flipped{background:#2980b9;transform:rotateY(180deg)}.card.matched{background:#27ae60;opacity:0.6}button{padding:10px 20px;background:#3498db;color:#fff;border:none;border-radius:5px;cursor:pointer;margin:5px;font-size:14px;font-weight:bold}a{color:#3498db;text-decoration:none;margin:0 10px}</style></head><body><div id="container"><h1>🎮 Memory Match</h1><div id="info">Pairs Found: <span id="pairs">0</span>/8 | Attempts: <span id="attempts">0</span></div><div id="grid"></div><div><button onclick="initGame()">New Game</button><a href="index.html">Back</a></div></div><script>const icons=['🍎','🍌','🍒','🍊','🍋','🍓','🥝','🍉'];let cards=[],flipped=[],matched=0,attempts=0;function initGame(){cards=[];flipped=[];matched=0;attempts=0;const deck=[...icons,...icons];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}cards=deck.map((icon,idx)=>({id:idx,icon:icon,flipped:false,matched:false}));render()}function render(){const grid=document.getElementById('grid');grid.innerHTML='';cards.forEach(card=>{const el=document.createElement('div');el.className='card';if(card.matched)el.classList.add('matched');if(card.flipped)el.classList.add('flipped');el.textContent=card.flipped||card.matched?card.icon:'';el.onclick=()=>flip(card);grid.appendChild(el)})}function flip(card){if(card.flipped||card.matched||flipped.length===2)return;card.flipped=true;flipped.push(card);render();if(flipped.length===2){attempts++;document.getElementById('attempts').textContent=attempts;if(flipped[0].icon===flipped[1].icon){flipped[0].matched=true;flipped[1].matched=true;matched++;document.getElementById('pairs').textContent=matched;if(matched===8){setTimeout(()=>{alert('You Won! Attempts: '+attempts);initGame()},500)}flipped=[];render()}else{setTimeout(()=>{flipped[0].flipped=false;flipped[1].flipped=false;flipped=[];render()},600)}}}initGame();</script></body></html>
