<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phaser Matching Game</title>
<style>body{margin:0;background:#1e1e2e;display:flex;flex-direction:column;height:100vh;font-family:Arial,sans-serif;color:#fff;overflow:hidden}header{padding:12px;text-align:center;background:#16213e}#game{flex:1}footer{padding:8px;text-align:center;font-size:12px;background:#16213e}</style>
</head>
<body>
<header>
  <h1>Memory Match (Phaser)</h1>
  <p>Click cards to find matching pairs.</p>
</header>
<div id="game"></div>
<footer>
  <a href="index.html" style="color:#64b5f6">Back to Games</a>
</footer>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
<script>
const config={type:Phaser.AUTO,parent:'game',width:800,height:600,physics:{default:'arcade'},scene:{create,update}};const game=new Phaser.Game(config);
function create(){this.add.rectangle(400,300,800,600,0x2d5016);this.add.text(400,20,'Memory Match Game',{fontSize:'20px',fill:'#fff'}).setOrigin(0.5);
 const symbols=['🎮','🎲','🎯','🎪','🎨','🎭'];const cards=[];let cardIndex=0;this.matched=0;this.selected=[];
 // create 4x3 grid of cards
 for(let r=0;r<3;r++){for(let c=0;c<4;c++){const x=120+c*140;const y=120+r*120;const cardData={symbol:symbols[Math.floor((r*4+c)/2)]};const card=this.add.rectangle(x,y,100,80,0x4a90e2);card.setInteractive();card.cardData=cardData;card.isFlipped=false;card.index=cardIndex++;card.on('pointerdown',()=>{if(!card.isFlipped&&this.selected.length<2){card.isFlipped=true;card.setFill(0xffcc00);const txt=this.add.text(card.x,card.y,card.cardData.symbol,{fontSize:'40px'});card.text=txt;this.selected.push(card);
 if(this.selected.length===2){const[c1,c2]=this.selected;if(c1.cardData.symbol===c2.cardData.symbol){this.matched++;setTimeout(()=>{c1.destroy();c1.text.destroy();c2.destroy();c2.text.destroy();this.selected=[];if(this.matched===6){this.add.text(400,300,'You Won!',{fontSize:'32px',fill:'#fff'}).setOrigin(0.5)}},600)}else{setTimeout(()=>{c1.setFill(0x4a90e2);c1.text.destroy();c2.setFill(0x4a90e2);c2.text.destroy();c1.isFlipped=false;c2.isFlipped=false;this.selected=[]},800)}}});cards.push(card)}})}
function update(){}
</script>
</body>
</html>
