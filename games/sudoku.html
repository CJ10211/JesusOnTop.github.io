<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sudoku</title><style>body{font-family:Arial;text-align:center;background:#1e1e1e;color:#fff;padding:20px}#grid{display:inline-block;border:3px solid #333}#grid div{display:inline-block;width:40px;height:40px;border:1px solid #666;line-height:40px;font-size:18px;background:#333;cursor:pointer}#grid div:nth-child(3n){border-right:2px solid #999}#grid div:nth-child(n+19):nth-child(-n+27),#grid div:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #999}button{padding:10px;margin:10px;background:#0366d6;color:#fff;border:0;cursor:pointer}</style></head><body><h1>Sudoku Puzzle</h1><p>Click cells to enter numbers (1-9)</p><div id="grid"></div><button onclick="resetSudoku()">New Game</button><p><a href="index.html" style="color:#64b5f6">Back</a></p><script>const puzzle=[5,3,0,0,7,0,0,0,0,6,0,0,1,9,5,0,0,0,0,9,8,0,0,0,0,6,0,8,0,0,0,6,0,0,0,3,4,0,0,8,0,3,0,0,1,7,0,0,0,2,0,0,0,6,0,6,0,0,0,0,2,8,0,0,0,0,4,1,9,0,0,5,0,0,0,0,8,0,0,7,9];let grid=[...puzzle];function drawGrid(){const g=document.getElementById('grid');g.innerHTML='';for(let i=0;i<81;i++){const div=document.createElement('div');div.textContent=grid[i]||'';div.style.background=puzzle[i]?'#555':'#333';div.onclick=()=>{if(!puzzle[i]){const n=prompt('Enter 1-9:');if(n&&n>=1&&n<=9){grid[i]=parseInt(n);drawGrid()}}};g.appendChild(div)}}function resetSudoku(){grid=[...puzzle];drawGrid()}drawGrid();</script></body></html>
