<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sudoku</title><style>body{margin:0;padding:20px;background:#2c3e50;color:#fff;font-family:Arial;text-align:center}#container{max-width:500px;margin:0 auto}h1{color:#3498db}#board{display:grid;grid-template-columns:repeat(9,40px);grid-template-rows:repeat(9,40px);gap:0;background:#000;padding:10px;border-radius:6px;margin:20px 0;justify-content:center}.cell{width:40px;height:40px;background:#3498db;border:1px solid #2980b9;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;font-size:18px}.cell:nth-child(3n){border-right:3px solid #000}.cell:nth-child(27n+1),.cell:nth-child(27n+2),.cell:nth-child(27n+3){border-top:3px solid #000}.cell.given{background:#2980b9;color:#ecf0f1}.cell.wrong{background:#e74c3c}button{padding:10px 20px;background:#3498db;color:#fff;border:none;border-radius:5px;cursor:pointer;margin:5px}a{color:#3498db;text-decoration:none;margin:0 10px}</style></head><body><div id="container"><h1>🔢 Sudoku</h1><div id="board"></div><div><button onclick="initGame()">New Game</button><a href="index.html">Back</a></div></div><script>const puzzle=[[5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],[8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],[0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]];let board,given;function initGame(){board=puzzle.map(r=>[...r]);given=board.map(r=>r.map(c=>c!==0));render()}function render(){const el=document.getElementById('board');el.innerHTML='';for(let i=0;i<81;i++){const row=Math.floor(i/9),col=i%9;const cell=document.createElement('div');cell.className='cell';if(given[row][col])cell.classList.add('given');cell.textContent=board[row][col]||'';cell.onclick=()=>{if(!given[row][col]){const num=prompt('Enter 1-9 (0 to clear):');if(num&&num>=0&&num<=9)board[row][col]=parseInt(num);render()}};el.appendChild(cell)}}initGame();</script></body></html>
