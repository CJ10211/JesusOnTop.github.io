<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minesweeper</title><style>body{margin:0;padding:20px;background:#2c3e50;color:#fff;font-family:Arial;text-align:center}#container{max-width:500px;margin:0 auto}h1{color:#3498db}#info{font-size:16px;margin:15px 0}#board{display:grid;grid-template-columns:repeat(8,40px);grid-template-rows:repeat(8,40px);gap:2px;justify-content:center;background:#34495e;padding:10px;border-radius:6px;margin:20px 0}.cell{width:40px;height:40px;background:#3498db;border:2px solid #2980b9;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:bold;border-radius:3px;user-select:none}.cell:hover{background:#5dade2}.cell.revealed{background:#ecf0f1;color:#000;border:1px solid #bdc3c7}.cell.mine::after{content:'💣'}.cell.flagged::after{content:'🚩'}button{padding:10px 20px;background:#3498db;color:#fff;border:none;border-radius:5px;cursor:pointer;margin:5px;font-weight:bold}a{color:#3498db;text-decoration:none;margin:0 10px}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px">
  <rect rx="8" width="64" height="64" fill="#fff"/>
  <rect x="28" y="8" width="8" height="48" fill="#0b6fbf"/>
  <rect x="12" y="28" width="40" height="8" fill="#0b6fbf"/>
</svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<div id="container"><h1>💣 Minesweeper</h1><div id="info">Mines: <span id="mines">10</span> | Flagged: <span id="flagged">0</span></div><div id="board"></div><div><button onclick="initGame()">New Game</button><a href="index.html">Back</a></div></div><script>const size=8,totalMines=10;let board=[],revealed=[],flagged=0;function initGame(){board=Array(size).fill(0).map(()=>Array(size).fill(0));revealed=Array(size).fill(0).map(()=>Array(size).fill(false));flagged=0;let minesPlaced=0;while(minesPlaced<totalMines){const x=Math.floor(Math.random()*size);const y=Math.floor(Math.random()*size);if(!board[y][x]){board[y][x]=1;minesPlaced++}}for(let y=0;y<size;y++){for(let x=0;x<size;x++){if(!board[y][x]){let count=0;for(let dy=-1;dy<=1;dy++){for(let dx=-1;dx<=1;dx++){const ny=y+dy,nx=x+dx;if(ny>=0&&ny<size&&nx>=0&&nx<size&&board[ny][nx])count++}}board[y][x]=count}}}render()}function reveal(x,y){if(revealed[y][x])return;revealed[y][x]=true;if(board[y][x]===1){alert('Game Over! You hit a mine.');initGame();return}if(board[y][x]===0){for(let dy=-1;dy<=1;dy++){for(let dx=-1;dx<=1;dx++){const ny=y+dy,nx=x+dx;if(ny>=0&&ny<size&&nx>=0&&nx<size&&!revealed[ny][nx])reveal(nx,ny)}}}}function toggleFlag(x,y){if(!revealed[y][x]){if(flagged<totalMines||flagged===totalMines&&!flagged){flagged++;flagged=Math.min(flagged,totalMines)}document.getElementById('flagged').textContent=flagged;render()}}function render(){const boardEl=document.getElementById('board');boardEl.innerHTML='';for(let y=0;y<size;y++){for(let x=0;x<size;x++){const cell=document.createElement('div');cell.className='cell';if(revealed[y][x]){cell.classList.add('revealed');if(board[y][x]===1){cell.textContent='💣'}else if(board[y][x]>0){cell.textContent=board[y][x]}}cell.onclick=()=>reveal(x,y);cell.oncontextmenu=e=>{e.preventDefault();toggleFlag(x,y)};boardEl.appendChild(cell)}}}initGame();</script></body></html>
