<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minesweeper</title><style>body{font-family:Arial;max-width:600px;margin:20px auto;padding:16px;background:#1e1e1e;color:#fff}canvas{display:block;margin:16px auto;border:2px solid #444;background:#000}h1{text-align:center}#controls{text-align:center;margin:16px 0}button{padding:8px 12px;margin:4px;background:#0366d6;color:#fff;border:0;border-radius:4px;cursor:pointer}</style></head><body><h1>Minesweeper</h1><div id="controls"><button onclick="initGame()">New Game</button><div>Mines: <span id="mineCount">10</span> | Flags: <span id="flagCount">0</span></div></div><canvas id="gameCanvas" width="320" height="320"></canvas><p style="text-align:center;font-size:12px"><a href="index.html" style="color:#64b5f6">Back</a></p><script>const c=document.getElementById('gameCanvas');const x=c.getContext('2d');const R=8,C=8,M=10;const S=40;let g=[],v=[],f=[],o=false;function init(){g=[];v=[];f=[];o=false;for(let i=0;i<R;i++){g[i]=[];v[i]=[];f[i]=[];for(let j=0;j<C;j++){g[i][j]=0;v[i][j]=false;f[i][j]=false}}let p=0;while(p<M){const r=Math.floor(Math.random()*R);const q=Math.floor(Math.random()*C);if(g[r][q]!=='X'){g[r][q]='X';p++;for(let dr=-1;dr<=1;dr++){for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=q+dc;if(nr>=0&&nr<R&&nc>=0&&nc<C&&g[nr][nc]!=='X'){g[nr][nc]++}}}}}upd();draw()}function upd(){let n=0;for(let i=0;i<R;i++){for(let j=0;j<C;j++){if(f[i][j])n++}}document.getElementById('flagCount').textContent=n;}function reveal(r,q){if(v[r][q]||f[r][q]||o)return;v[r][q]=true;if(g[r][q]==='X'){o=true;alert('Game Over!')}else if(g[r][q]===0){for(let dr=-1;dr<=1;dr++){for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=q+dc;if(nr>=0&&nr<R&&nc>=0&&nc<C&&!v[nr][nc]){reveal(nr,nc)}}}}draw()}function toggleFlag(r,q){if(!v[r][q])f[r][q]=!f[r][q];upd();draw()}function draw(){x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);for(let i=0;i<R;i++){for(let j=0;j<C;j++){const px=j*S,py=i*S;if(v[i][j]){x.fillStyle='#666';x.fillRect(px,py,S,S);x.strokeStyle='#444';x.strokeRect(px,py,S,S);if(g[i][j]==='X'){x.fillStyle='#f00';x.fillRect(px+10,py+10,20,20)}else if(g[i][j]>0){x.fillStyle='#fff';x.font='16px Arial';x.textAlign='center';x.fillText(g[i][j],px+S/2,py+S/2+5)}}else{x.fillStyle=f[i][j]?'#ff6':'#999';x.fillRect(px,py,S,S);x.strokeStyle='#666';x.strokeRect(px,py,S,S);if(f[i][j]){x.fillStyle='#f00';x.font='bold 20px Arial';x.textAlign='center';x.fillText('🚩',px+S/2,py+S/2+5)}}}}c.addEventListener('click',(e)=>{const r=c.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;const q=Math.floor(px/S),i=Math.floor(py/S);if(i>=0&&i<R&&q>=0&&q<C)reveal(i,q)});c.addEventListener('contextmenu',(e)=>{e.preventDefault();const r=c.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;const q=Math.floor(px/S),i=Math.floor(py/S);if(i>=0&&i<R&&q>=0&&q<C)toggleFlag(i,q)});init();</script></body></html>
