<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breakout</title><style>body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;font-family:Arial}canvas{background:#0a0a0a;border:4px solid #ff6b9d;margin:20px;box-shadow:0 12px 24px rgba(0,0,0,0.3)}#info{font-size:18px;font-weight:bold}button{padding:10px 20px;background:#ff6b9d;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin:8px}a{color:#ff6b9d;text-decoration:none;margin:0 8px}</style></head><body><h1>🧱 Breakout</h1><div id="info">Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div><canvas id="c" width="480" height="600"></canvas><div><button onclick="location.reload()">Restart</button><a href="index.html">Back</a></div><script>const c=document.getElementById('c');const ctx=c.getContext('2d');const paddle={x:200,y:570,w:80,h:12,dx:0};let ball={x:240,y:550,r:8,dx:4,dy:-4};let bricks=[];let score=0,lives=3,gameOver=false;for(let row=0;row<4;row++){for(let col=0;col<8;col++){bricks.push({x:col*60,y:row*20+20,w:58,h:18,hit:false})}}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')paddle.dx=-6;if(e.key==='ArrowRight')paddle.dx=6});document.addEventListener('keyup',()=>{paddle.dx=0});function update(){paddle.x+=paddle.dx;if(paddle.x<0)paddle.x=0;if(paddle.x+paddle.w>c.width)paddle.x=c.width-paddle.w;ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x-ball.r<0||ball.x+ball.r>c.width)ball.dx*=-1;if(ball.y-ball.r<0)ball.dy*=-1;if(ball.y-ball.r>c.height){lives--;if(lives<=0)gameOver=true;else ball={x:240,y:550,r:8,dx:4,dy:-4}}if(ball.x>paddle.x&&ball.x<paddle.x+paddle.w&&ball.y+ball.r>paddle.y&&ball.y<paddle.y+paddle.h)ball.dy*=-1;for(let brick of bricks){if(!brick.hit&&ball.x>brick.x&&ball.x<brick.x+brick.w&&ball.y>brick.y&&ball.y<brick.y+brick.h){brick.hit=true;ball.dy*=-1;score+=10}}document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives}function draw(){ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#ff6b9d';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#00ff88';for(let brick of bricks){if(!brick.hit){ctx.fillRect(brick.x,brick.y,brick.w,brick.h)}}if(gameOver){ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText('Game Over',c.width/2,c.height/2);ctx.font='20px Arial';ctx.fillText('Score: '+score,c.width/2,c.height/2+40)}}function gameLoop(){if(!gameOver)update();draw();requestAnimationFrame(gameLoop)}gameLoop();</script></body></html>
