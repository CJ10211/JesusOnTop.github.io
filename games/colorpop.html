<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Pop</title><style>body{margin:0;padding:20px;background:#1a1a2e;color:#fff;font-family:Arial;text-align:center}h1{margin-top:0}canvas{background:#0f3460;border:3px solid #e94560;display:block;margin:20px auto}#info{font-size:18px;margin:10px}button{padding:10px 20px;background:#e94560;border:0;cursor:pointer;border-radius:4px;color:#fff}a{color:#64b5f6}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px">
  <rect rx="8" width="64" height="64" fill="#fff"/>
  <rect x="28" y="8" width="8" height="48" fill="#0b6fbf"/>
  <rect x="12" y="28" width="40" height="8" fill="#0b6fbf"/>
</svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<h1>🎨 Color Pop</h1><div id="info">Score: <span id="score">0</span> | Combo: <span id="combo">0</span></div><canvas id="c" width="400" height="500"></canvas><div><button onclick="location.reload()">Restart</button> <a href="index.html">Back</a></div><script>const c=document.getElementById('c');const ctx=c.getContext('2d');const cols=['#ff3333','#33ff33','#3333ff','#ffff33','#ff33ff'];let boxes=[];let s=0,co=0,t=60;function init(){boxes=[];for(let i=0;i<4;i++){for(let j=0;j<4;j++){boxes.push({x:j*100,y:i*125,w:100,h:125,col:cols[Math.floor(Math.random()*cols.length)],hit:false})}}}function u(){if(t>0)t--;else t=60;boxes=boxes.map(b=>({...b,hit:false}))}function draw(){ctx.fillStyle='#0f3460';ctx.fillRect(0,0,c.width,c.height);for(let b of boxes){ctx.fillStyle=b.col;ctx.globalAlpha=b.hit?0.3:1;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.globalAlpha=1;ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(b.x,b.y,b.w,b.h)}ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.fillText('Time: '+Math.ceil(t/60),20,20)}c.addEventListener('click',e=>{const r=c.getBoundingClientRect();const mx=e.clientX-r.left;const my=e.clientY-r.top;for(let b of boxes){if(mx>b.x&&mx<b.x+b.w&&my>b.y&&my<b.y+b.h){b.hit=true;s+=10;co++}}document.getElementById('score').textContent=s;document.getElementById('combo').textContent=co});function gl(){if(t>0){u();draw();requestAnimationFrame(gl)}else{ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText('Time Up!',c.width/2,c.height/2);ctx.font='20px Arial';ctx.fillText('Score: '+s,c.width/2,c.height/2+40)}}init();gl();</script></body></html>
