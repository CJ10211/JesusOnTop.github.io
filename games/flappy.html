<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flappy Bird</title><style>body{margin:0;padding:0;background:#87ceeb;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}#gameContainer{text-align:center}canvas{background:linear-gradient(180deg,#87ceeb 0%,#e0f6ff 100%);display:block;border:4px solid #333;box-shadow:0 8px 16px rgba(0,0,0,0.2)}h1{margin:10px 0;color:#333}#score{font-size:24px;color:#333;margin:10px 0}button{padding:10px 20px;margin:5px;background:#333;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:14px}a{color:#333;text-decoration:none;margin:0 10px}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px">
  <rect rx="8" width="64" height="64" fill="#fff"/>
  <rect x="28" y="8" width="8" height="48" fill="#0b6fbf"/>
  <rect x="12" y="28" width="40" height="8" fill="#0b6fbf"/>
</svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<div id="gameContainer"><h1>🐦 Flappy Bird</h1><div id="score">Score: 0</div><canvas id="gameCanvas" width="400" height="600"></canvas><div><button onclick="location.reload()">Restart</button><a href="index.html">Back to Games</a></div></div><script>const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');const bird={x:50,y:150,radius:12,velocityY:0,gravity:0.6,jumpPower:-12};let pipes=[],score=0,gameOver=false;const pipeWidth=60,pipeGap=120,pipeFrequency=90;let frameCount=0;function drawBird(){ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(bird.x,bird.y,bird.radius,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(bird.x+5,bird.y-3,3,0,Math.PI*2);ctx.fill()}function drawPipes(){ctx.fillStyle='#2ecc71';pipes.forEach(pipe=>{ctx.fillRect(pipe.x,0,pipeWidth,pipe.topHeight);ctx.fillRect(pipe.x,pipe.topHeight+pipeGap,pipeWidth,canvas.height-pipe.topHeight-pipeGap);ctx.strokeStyle='#27ae60';ctx.lineWidth=2;ctx.strokeRect(pipe.x,0,pipeWidth,pipe.topHeight);ctx.strokeRect(pipe.x,pipe.topHeight+pipeGap,pipeWidth,canvas.height-pipe.topHeight-pipeGap)})}function drawGround(){ctx.fillStyle='#8B7355';ctx.fillRect(0,canvas.height-20,canvas.width,20);ctx.fillStyle='#A0826D';for(let i=0;i<canvas.width;i+=40){ctx.fillRect(i,canvas.height-20,20,20)}}function update(){bird.velocityY+=bird.gravity;bird.y+=bird.velocityY;if(bird.y+bird.radius>canvas.height-20||bird.y-bird.radius<0)gameOver=true;frameCount++;if(frameCount%pipeFrequency===0){const topHeight=Math.random()*(canvas.height-pipeGap-100)+50;pipes.push({x:canvas.width,topHeight:topHeight})}pipes.forEach(pipe=>{pipe.x-=5;if(pipe.x+pipeWidth<bird.x&&!pipe.scored){pipe.scored=true;score++}if(bird.x+bird.radius>pipe.x&&bird.x-bird.radius<pipe.x+pipeWidth){if(bird.y-bird.radius<pipe.topHeight||bird.y+bird.radius>pipe.topHeight+pipeGap){gameOver=true}}});pipes=pipes.filter(p=>p.x>-pipeWidth)}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#87ceeb';ctx.fillRect(0,0,canvas.width,canvas.height);drawPipes();drawGround();drawBird();ctx.fillStyle='#333';ctx.font='20px Arial';ctx.fillText('Score: '+score,10,30);if(gameOver){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.font='bold 40px Arial';ctx.textAlign='center';ctx.fillText('GAME OVER',canvas.width/2,canvas.height/2-40);ctx.font='20px Arial';ctx.fillText('Score: '+score,canvas.width/2,canvas.height/2+20)}}function gameLoop(){if(!gameOver)update();draw();requestAnimationFrame(gameLoop)}canvas.addEventListener('click',()=>{bird.velocityY=bird.jumpPower});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();bird.velocityY=bird.jumpPower}});gameLoop();</script></body></html>
