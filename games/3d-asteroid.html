<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Asteroid</title><style>body{margin:0;overflow:hidden;background:#000;font-family:Arial}canvas{display:block}#info{position:fixed;top:10px;left:10px;color:#00ff00;background:rgba(0,0,0,0.7);padding:15px;border-radius:5px;z-index:10;font-family:monospace}#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border:2px solid #00ff00;border-radius:50%;pointer-events:none}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px">
  <rect rx="8" width="64" height="64" fill="#fff"/>
  <rect x="28" y="8" width="8" height="48" fill="#0b6fbf"/>
  <rect x="12" y="28" width="40" height="8" fill="#0b6fbf"/>
</svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<div id="info"><h3>3D Asteroid Shooter</h3><p>Score: <span id="score">0</span></p><p>Asteroids: <span id="asteroids">5</span></p></div><div id="crosshair"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,2000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,0.6));const asteroids=[],bullets=[];let score=0;function createAsteroid(x,y,z,size=3){const asteroid=new THREE.Mesh(new THREE.IcosahedronGeometry(size,2),new THREE.MeshLambertMaterial({color:0x8B7355}));asteroid.position.set(x,y,z);asteroid.rotation.x=Math.random()*Math.PI;asteroid.rotation.y=Math.random()*Math.PI;asteroid.velocity={x:(Math.random()-0.5)*0.5,y:(Math.random()-0.5)*0.5,z:(Math.random()-0.5)*0.5};asteroid.size=size;scene.add(asteroid);asteroids.push(asteroid)}for(let i=0;i<5;i++){createAsteroid(Math.random()*200-100,Math.random()*200-100,Math.random()*200-100)}camera.position.z=30;const keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape')window.location.href='index.html'});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});window.addEventListener('click',()=>{const bullet=new THREE.Mesh(new THREE.SphereGeometry(0.5,8,8),new THREE.MeshLambertMaterial({color:0x00ff00}));bullet.position.copy(camera.position);const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);bullet.velocity={x:dir.x*2,y:dir.y*2,z:dir.z*2};scene.add(bullet);bullets.push(bullet)});function update(){asteroids.forEach(a=>{a.position.x+=a.velocity.x;a.position.y+=a.velocity.y;a.position.z+=a.velocity.z;a.rotation.x+=0.01;a.rotation.y+=0.01});bullets.forEach(b=>{b.position.x+=b.velocity.x;b.position.y+=b.velocity.y;b.position.z+=b.velocity.z});for(let i=bullets.length-1;i>=0;i--){for(let j=asteroids.length-1;j>=0;j--){const dist=bullets[i].position.distanceTo(asteroids[j].position);if(dist<asteroids[j].size+0.5){score+=100;scene.remove(asteroids[j]);asteroids.splice(j,1);scene.remove(bullets[i]);bullets.splice(i,1);if(asteroids[j]&&asteroids[j].size>1){createAsteroid(asteroids[j].position.x,asteroids[j].position.y,asteroids[j].position.z,asteroids[j].size-1)}break}}}if(asteroids.length===0){for(let i=0;i<7;i++){createAsteroid(Math.random()*200-100,Math.random()*200-100,Math.random()*200-100)}}if(keys['arrowup'])camera.position.y+=0.5;if(keys['arrowdown'])camera.position.y-=0.5;if(keys['arrowleft'])camera.position.x-=0.5;if(keys['arrowright'])camera.position.x+=0.5;document.getElementById('score').textContent=score;document.getElementById('asteroids').textContent=asteroids.length}function animate(){requestAnimationFrame(animate);update();renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});</script></body></html>
