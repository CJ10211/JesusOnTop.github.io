<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spacing Game</title><style>body{margin:0;padding:20px;background:#1a1a1a;color:#fff;font-family:Arial;text-align:center}#game{width:400px;height:500px;margin:20px auto;background:#000;border:3px solid #00ff00;position:relative;overflow:hidden}#player{width:30px;height:30px;background:#00ff00;position:absolute;bottom:10px;left:185px}.obstacle{width:60px;height:60px;background:#ff0000;position:absolute}.laser{width:40px;height:5px;background:#ffff00;position:absolute}#info{font-size:18px;margin:10px}button{padding:10px 20px;background:#00ff00;color:#000;border:0;cursor:pointer;border-radius:4px}a{color:#00ff00}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px">
  <rect rx="8" width="64" height="64" fill="#fff"/>
  <rect x="28" y="8" width="8" height="48" fill="#0b6fbf"/>
  <rect x="12" y="28" width="40" height="8" fill="#0b6fbf"/>
</svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<h1>⚡ Spacing Game</h1><div id="info">Score: <span id="score">0</span></div><div id="game"><div id="player"></div></div><div><button onclick="location.reload()">Restart</button> <a href="index.html">Back</a></div><script>const g=document.getElementById('game');const pl=document.getElementById('player');let s=0,go=false;pl.style.left='185px';let px=185;document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&px>0){px-=20;pl.style.left=px+'px'}if(e.key==='ArrowRight'&&px<370){px+=20;pl.style.left=px+'px'}});function spawnOb(){const o=document.createElement('div');o.className='obstacle';o.style.left=Math.random()*(g.clientWidth-60)+'px';o.style.top='-60px';let oy=parseFloat(o.style.top);g.appendChild(o);const i=setInterval(()=>{oy+=8;o.style.top=oy+'px';if(oy>g.clientHeight){clearInterval(i);o.remove()}const pr=pl.getBoundingClientRect();const or=o.getBoundingClientRect();if(pr.bottom>or.top&&pr.top<or.bottom&&pr.right>or.left&&pr.left<or.right){go=true}},30)}function u(){if(!go){s+=0.5;document.getElementById('score').textContent=Math.floor(s);if(Math.random()<0.02)spawnOb()}else{document.getElementById('game').style.background='#330000';const msg=document.createElement('div');msg.textContent='Game Over\nScore: '+Math.floor(s);msg.style.color='#fff';msg.style.fontSize='20px';msg.style.textAlign='center';msg.style.marginTop='200px'}}setInterval(u,50);</script></body></html>
