<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hangman</title><style>body{font-family:Arial;max-width:600px;margin:20px auto;padding:16px;background:#1e1e1e;color:#fff;text-align:center}#word{font-size:28px;letter-spacing:8px;margin:20px;font-family:monospace}#guesses{margin:20px}button{padding:8px 12px;margin:2px;background:#0366d6;color:#fff;border:0;border-radius:4px;cursor:pointer}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px"><rect rx="8" width="64" height="64" fill="#fff"/><circle cx="20" cy="32" r="10" fill="#0b6fbf"/><path d="M34 20h10v24H34z" fill="#0b88e0"/></svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<h1>Hangman</h1><p>Guess the word!</p><p>Wrong: <span id="wrong">0</span>/6</p><div id="word"></div><div id="guesses"></div><button onclick="init()">New Game</button><p><a href="index.html" style="color:#64b5f6">Back</a></p><script>const words=['JAVASCRIPT','PROGRAMMING','COMPUTER','DEVELOPER','WEBSITE','HANGMAN','KEYBOARD','MONITOR'];let word='',guessed=[],wrong=0;function init(){word=words[Math.floor(Math.random()*words.length)];guessed=[];wrong=0;update()}function update(){let display='';for(let c of word)display+=(guessed.includes(c)?c:' _ ')+' ';document.getElementById('word').textContent=display;let html='';for(let i=65;i<=90;i++){const c=String.fromCharCode(i);html+=`<button onclick="guess('${c}')" ${guessed.includes(c)?'disabled':''}>${c}</button>`}document.getElementById('guesses').innerHTML=html;document.getElementById('wrong').textContent=wrong;if(wrong>=6){document.getElementById('word').innerHTML='GAME OVER! Word: '+word;document.getElementById('guesses').innerHTML='<button onclick="init()">Play Again</button>'}}function guess(c){if(!guessed.includes(c)){guessed.push(c);if(!word.includes(c))wrong++;update()}}init();</script></body></html>
