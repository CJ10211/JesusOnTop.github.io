<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Endless Jumper</title><style>body{margin:0;padding:20px;background:#ffd700;color:#333;font-family:Arial;text-align:center}canvas{background:#87ceeb;border:3px solid #333;display:block;margin:20px auto}#info{font-size:18px;margin:10px}button{padding:10px 20px;background:#333;color:#ffd700;border:0;cursor:pointer;border-radius:4px}a{color:#333}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px"><rect rx="8" width="64" height="64" fill="#fff"/><circle cx="20" cy="32" r="10" fill="#0b6fbf"/><path d="M34 20h10v24H34z" fill="#0b88e0"/></svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<h1>🦘 Endless Jumper</h1><div id="info">Score: <span id="score">0</span></div><canvas id="c" width="400" height="600"></canvas><div><button onclick="location.reload()">Restart</button> <a href="index.html">Back</a></div><script>const c=document.getElementById('c');const ctx=c.getContext('2d');const p={x:175,y:500,w:40,h:40,v:0,g:0.5};let plat=[];let s=0,go=false;for(let i=0;i<6;i++)plat.push({x:Math.random()*(c.width-50),y:i*100,w:50,h:15});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&p.x>0)p.x-=15;if(e.key==='ArrowRight'&&p.x<c.width-p.w)p.x+=15});function u(){p.v+=p.g;p.y+=p.v;if(p.y>c.height)go=true;for(let pl of plat){if(p.v>0&&p.y+p.h>=pl.y&&p.y+p.h<=pl.y+15&&p.x+p.w>pl.x&&p.x<pl.x+pl.w){p.v=-15;s+=10}}plat.forEach(pl=>pl.y+=2);while(plat.length<6){const last=plat[plat.length-1];plat.push({x:Math.random()*(c.width-50),y:last.y-100,w:50,h:15})}plat=plat.filter(pl=>pl.y<c.height+50);document.getElementById('score').textContent=s}function d(){ctx.fillStyle='#87ceeb';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#ff6b6b';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#228b22';for(let pl of plat)ctx.fillRect(pl.x,pl.y,pl.w,pl.h);if(go){ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText('Game Over',c.width/2,c.height/2);ctx.font='20px Arial';ctx.fillText('Score: '+s,c.width/2,c.height/2+40)}}function gl(){if(!go)u();d();requestAnimationFrame(gl)}gl();</script></body></html>
