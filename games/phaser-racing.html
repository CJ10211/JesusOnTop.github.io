<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Racing Game</title><style>body{margin:0;padding:20px;background:#1a1a2e;color:#fff;font-family:Arial;text-align:center}canvas{background:#0f3460;border:4px solid #e94560;display:block;margin:20px auto;box-shadow:0 8px 16px rgba(0,0,0,0.3)}#info{font-size:18px;margin:10px 0}button{padding:10px 20px;background:#e94560;color:#fff;border:none;border-radius:5px;cursor:pointer;margin:5px;font-weight:bold}a{color:#64b5f6;text-decoration:none;margin:0 10px}</style></head><body><h1>🏎️ Racing Game</h1><div id="info">Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div><canvas id="gameCanvas" width="400" height="600"></canvas><div><button onclick="location.reload()">Restart</button><a href="index.html">Back</a></div><script>const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');const player={x:175,y:500,w:50,h:60};let enemies=[],score=0,lives=3,gameOver=false;function drawRoad(){ctx.fillStyle='#333';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#ffff00';ctx.lineWidth=3;for(let i=-30;i<canvas.height;i+=60){ctx.beginPath();ctx.moveTo(canvas.width/2,i);ctx.lineTo(canvas.width/2,i+30);ctx.stroke()}}function drawPlayer(){ctx.fillStyle='#ff0000';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle='#ffff00';ctx.fillRect(player.x+10,player.y+5,10,15);ctx.fillRect(player.x+30,player.y+5,10,15)}function drawEnemies(){ctx.fillStyle='#00ff00';enemies.forEach(enemy=>{ctx.fillRect(enemy.x,enemy.y,enemy.w,enemy.h);ctx.fillStyle='#ffff00';ctx.fillRect(enemy.x+10,enemy.y+5,10,15);ctx.fillRect(enemy.x+30,enemy.y+5,10,15);ctx.fillStyle='#00ff00'})}function update(){if(Math.random()<0.02){const x=Math.random()>0.5?80:250;enemies.push({x:x,y:-60,w:50,h:60,speed:5})}enemies.forEach(enemy=>{enemy.y+=enemy.speed;if(player.x<enemy.x+enemy.w&&player.x+player.w>enemy.x&&player.y<enemy.y+enemy.h&&player.y+player.h>enemy.y){lives--;if(lives<=0)gameOver=true}});enemies=enemies.filter(e=>e.y<canvas.height);score+=1;document.getElementById('score').textContent=Math.floor(score/10);document.getElementById('lives').textContent=lives}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&player.x>20)player.x-=20;if(e.key==='ArrowRight'&&player.x<canvas.width-70)player.x+=20});function draw(){drawRoad();drawPlayer();drawEnemies();ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.fillText('High Score: '+Math.floor(score/10),10,30);if(gameOver){ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText('GAME OVER',canvas.width/2,canvas.height/2-40);ctx.font='20px Arial';ctx.fillText('Score: '+Math.floor(score/10),canvas.width/2,canvas.height/2+20)}}function gameLoop(){if(!gameOver)update();draw();requestAnimationFrame(gameLoop)}gameLoop();</script></body></html>
