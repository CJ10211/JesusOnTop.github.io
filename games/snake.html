<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title>
<style>body{margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;background:#111;color:#fff;font-family:Arial}canvas{background:#000;border:6px solid #222}</style>
</head>
<body>
<canvas id="c" width="400" height="400"></canvas>
<script>
const cvs=document.getElementById('c');const ctx=cvs.getContext('2d');const size=20;let cols=cvs.width/size,rows=cvs.height/size;let snake=[{x:8,y:8}];let dir={x:1,y:0};let food=randomCell();let speed=120;let score=0;let running=true;document.addEventListener('keydown',e=>{if(e.key.includes('Arrow')){if(e.key==='ArrowUp'&&dir.y!==1)dir={x:0,y:-1};if(e.key==='ArrowDown'&&dir.y!==-1)dir={x:0,y:1};if(e.key==='ArrowLeft'&&dir.x!==1)dir={x:-1,y:0};if(e.key==='ArrowRight'&&dir.x!==-1)dir={x:1,y:0}}});cvs.addEventListener('touchstart',handleTouch);
function handleTouch(e){const t=e.touches[0];const r=cvs.getBoundingClientRect();const x=(t.clientX-r.left)-r.width/2;const y=(t.clientY-r.top)-r.height/2;if(Math.abs(x)>Math.abs(y)){dir = x>0?{x:1,y:0}:{x:-1,y:0}}else{dir = y>0?{x:0,y:1}:{x:0,y:-1}}}
function randomCell(){let x=Math.floor(Math.random()*cols);let y=Math.floor(Math.random()*rows);while(snake.some(s=>s.x===x&&s.y===y)){x=Math.floor(Math.random()*cols);y=Math.floor(Math.random()*rows)}return {x,y}}
function loop(){if(!running) return;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=cols||head.y<0||head.y>=rows||snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;food=randomCell();}else{snake.pop()}draw();setTimeout(loop,speed)}
function gameOver(){running=false;ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,cvs.width,cvs.height);ctx.fillStyle='#fff';ctx.font='20px Arial';ctx.fillText('Game Over — Score: '+score,20,cvs.height/2);}
function draw(){ctx.clearRect(0,0,cvs.width,cvs.height);ctx.fillStyle='#0f0';snake.forEach((s,i)=>{ctx.fillStyle=i? '#7fff7f':'#0f0';ctx.fillRect(s.x*size,s.y*size,size-1,size-1)});ctx.fillStyle='#f33';ctx.fillRect(food.x*size,food.y*size,size-1,size-1);ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.fillText('Score: '+score,8,12)}
loop();
</script>
</body>
</html>
