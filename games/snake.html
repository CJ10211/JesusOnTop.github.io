<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake Game</title><style>body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;font-family:Arial}canvas{background:#1a1a2e;border:4px solid #00ff88;margin:20px;box-shadow:0 12px 24px rgba(0,0,0,0.3)}#info{font-size:20px;font-weight:bold}button{padding:12px 24px;background:#00ff88;color:#000;border:none;border-radius:8px;cursor:pointer;font-weight:bold;margin:10px;font-size:14px}a{color:#00ff88;text-decoration:none;margin:0 10px}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px">
  <rect rx="8" width="64" height="64" fill="#fff"/>
  <rect x="28" y="8" width="8" height="48" fill="#0b6fbf"/>
  <rect x="12" y="28" width="40" height="8" fill="#0b6fbf"/>
</svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<h1>🐍 Snake Game</h1><div id="info">Score: <span id="score">0</span> | High: <span id="high">0</span></div><canvas id="c" width="400" height="400"></canvas><div><button onclick="location.reload()">Restart</button><a href="index.html">Back</a></div><script>const c=document.getElementById('c');const ctx=c.getContext('2d');const size=20;let cols=c.width/size,rows=c.height/size;let snake=[{x:8,y:8}];let dir={x:1,y:0};let food=randomCell();let score=0,high=localStorage.getItem('snakeHigh')||0;let running=true;document.getElementById('high').textContent=high;document.addEventListener('keydown',e=>{if(e.key.includes('Arrow')){if(e.key==='ArrowUp'&&dir.y!==1)dir={x:0,y:-1};if(e.key==='ArrowDown'&&dir.y!==-1)dir={x:0,y:1};if(e.key==='ArrowLeft'&&dir.x!==1)dir={x:-1,y:0};if(e.key==='ArrowRight'&&dir.x!==-1)dir={x:1,y:0}}});function randomCell(){let x=Math.floor(Math.random()*cols);let y=Math.floor(Math.random()*rows);while(snake.some(s=>s.x===x&&s.y===y)){x=Math.floor(Math.random()*cols);y=Math.floor(Math.random()*rows)}return {x,y}}function loop(){if(!running)return;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=cols||head.y<0||head.y>=rows||snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;food=randomCell()}else{snake.pop()}draw();setTimeout(loop,120)}function gameOver(){running=false;if(score>high){high=score;localStorage.setItem('snakeHigh',high);document.getElementById('high').textContent=high}ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText('Game Over',c.width/2,c.height/2-20);ctx.font='20px Arial';ctx.fillText('Score: '+score+' | High: '+high,c.width/2,c.height/2+20)}function draw(){ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#00ff88';snake.forEach((s,i)=>{ctx.fillStyle=i?'#00cc66':'#00ff88';ctx.fillRect(s.x*size,s.y*size,size-2,size-2)});ctx.fillStyle='#ff6b9d';ctx.beginPath();ctx.arc(food.x*size+size/2,food.y*size+size/2,size/3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.fillText('Score: '+score,8,20)}loop();</script></body></html>
