<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tetris</title><style>body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;font-family:Arial}canvas{background:#111;border:4px solid #00d4ff;margin:20px;box-shadow:0 12px 24px rgba(0,0,0,0.3)}#info{font-size:18px;font-weight:bold}button{padding:10px 20px;background:#00d4ff;color:#000;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin:8px}a{color:#00d4ff;text-decoration:none;margin:0 8px}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px"><rect rx="8" width="64" height="64" fill="#fff"/><circle cx="20" cy="32" r="10" fill="#0b6fbf"/><path d="M34 20h10v24H34z" fill="#0b88e0"/></svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<h1>🧱 Tetris</h1><div id="info">Score: <span id="score">0</span> | Level: <span id="level">1</span></div><canvas id="c" width="300" height="600"></canvas><div><button onclick="location.reload()">Restart</button><a href="index.html">Back</a></div><script>const c=document.getElementById('c');const ctx=c.getContext('2d');const cols=10,rows=20,size=30;let grid=Array(rows).fill(0).map(()=>Array(cols).fill(0));let score=0,level=1;const pieces=[{shape:[[1,1,1,1]],color:'#00ffff'},{shape:[[1,1],[1,1]],color:'#ffff00'},{shape:[[0,1,1],[1,1,0]],color:'#ff0000'},{shape:[[1,1,0],[0,1,1]],color:'#00ff00'},{shape:[[1,0,0],[1,1,1]],color:'#ff6b00'},{shape:[[0,0,1],[1,1,1]],color:'#0000ff'},{shape:[[0,1,0],[1,1,1]],color:'#ff00ff'}];let current,x,y,gameOver=false;function spawnPiece(){const p=pieces[Math.floor(Math.random()*pieces.length)];current=p.shape.map(r=>[...r]);x=Math.floor(cols/2)-1;y=0;if(collide(x,y,current)){gameOver=true}}function collide(x,y,piece){for(let i=0;i<piece.length;i++){for(let j=0;j<piece[i].length;j++){if(piece[i][j]){const ny=y+i,nx=x+j;if(nx<0||nx>=cols||ny>=rows||grid[ny]&&grid[ny][nx])return true}}}return false}function lock(){for(let i=0;i<current.length;i++){for(let j=0;j<current[i].length;j++){if(current[i][j]){grid[y+i][x+j]=current[i][j];score+=10}}}clearLines();spawnPiece()}function clearLines(){let lines=0;for(let i=rows-1;i>=0;i--){if(grid[i].every(cell=>cell)){grid.splice(i,1);grid.unshift(Array(cols).fill(0));lines++}}score+=lines*100;level=Math.floor(score/500)+1;document.getElementById('score').textContent=score;document.getElementById('level').textContent=level}function draw(){ctx.fillStyle='#111';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#333';ctx.lineWidth=0.5;for(let i=0;i<=rows;i++)ctx.drawImage(document.createElement('canvas'),0,i*size,c.width,1);for(let j=0;j<=cols;j++)ctx.drawImage(document.createElement('canvas'),j*size,0,1,c.height);for(let i=0;i<rows;i++){for(let j=0;j<cols;j++){if(grid[i][j]){ctx.fillStyle=pieces.find(p=>p.shape.some(r=>r.some(c=>c===grid[i][j]))).color;ctx.fillRect(j*size,i*size,size-1,size-1)}}}for(let i=0;i<current.length;i++){for(let j=0;j<current[i].length;j++){if(current[i][j]){ctx.fillStyle='#ffff00';ctx.fillRect((x+j)*size,(y+i)*size,size-1,size-1)}}}if(gameOver){ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText('GAME OVER',c.width/2,c.height/2);ctx.font='16px Arial';ctx.fillText('Score: '+score,c.width/2,c.height/2+40)}}function update(){if(!gameOver){if(!collide(x,y+1,current)){y++}else{lock()}draw()}}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&!collide(x-1,y,current))x--;if(e.key==='ArrowRight'&&!collide(x+1,y,current))x++;if(e.key==='ArrowUp'){const rotated=current[0].map((,i)=>current.map(r=>r[i]).reverse());if(!collide(x,y,rotated))current=rotated}if(e.key==='ArrowDown')update()});spawnPiece();setInterval(update,1000-level*50);</script></body></html>
