<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometry Dash</title><style>body{font-family:Arial;text-align:center;background:#000;color:#fff;padding:20px}#game{position:relative;width:600px;height:300px;margin:20px auto;background:#333;border:2px solid #fff;overflow:hidden}#player{position:absolute;width:30px;height:30px;background:#0ff;bottom:50px;left:50px}#score{font-size:20px;margin:10px}button{padding:10px;margin:10px;background:#0366d6;color:#fff;border:0;cursor:pointer}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px">
  <rect rx="8" width="64" height="64" fill="#fff"/>
  <rect x="28" y="8" width="8" height="48" fill="#0b6fbf"/>
  <rect x="12" y="28" width="40" height="8" fill="#0b6fbf"/>
</svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<h1>Geometry Dash</h1><div id="score">Score: 0</div><div id="game"><div id="player"></div></div><button onclick="startGame()">Start Game</button><p><a href="index.html" style="color:#64b5f6">Back</a></p><script>let score=0,jumping=false,playerY=50;const player=document.getElementById('player');const game=document.getElementById('game');let obstacles=[];document.addEventListener('keydown',(e)=>{if(e.key===' '&&!jumping){jumping=true;let vy=-15;const jump=setInterval(()=>{playerY+=vy;vy+=0.6;player.style.bottom=playerY+'px';if(playerY<=50){playerY=50;jumping=false;clearInterval(jump)}},30)}});function spawnObstacle(){const obs=document.createElement('div');obs.style.position='absolute';obs.style.width='30px';obs.style.height='50px';obs.style.background='#f00';obs.style.left='600px';obs.style.bottom='50px';game.appendChild(obs);let x=600;const move=setInterval(()=>{x-=8;obs.style.left=x+'px';if(x<50&&x>20&&playerY<=90){alert('Game Over! Score: '+score);clearInterval(move);score=0};if(x<-30){game.removeChild(obs);clearInterval(move);score+=10;document.getElementById('score').textContent='Score: '+score}},30);obstacles.push(move)}setInterval(spawnObstacle,1500);startGame=()=>{score=0};</script></body></html>
