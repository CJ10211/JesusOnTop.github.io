<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jump Quest</title><style>body{margin:0;padding:20px;background:#2b2d42;color:#fff;font-family:Arial;text-align:center}canvas{background:#edf1f5;border:3px solid #ff006e;display:block;margin:20px auto}#info{font-size:18px;margin:10px;color:#ff006e}button{padding:10px 20px;background:#ff006e;color:#fff;border:0;cursor:pointer;border-radius:4px}a{color:#a0aaff}</style></head><body><h1>🦘 Jump Quest</h1><div id="info">Score: <span id="score">0</span></div><canvas id="c" width="400" height="600"></canvas><div><button onclick="location.reload()">Restart</button> <a href="index.html">Back</a></div><script>const c=document.getElementById('c');const ctx=c.getContext('2d');const p={x:175,y:500,w:50,h:50,v:0,g:0.6};let plat=[];let s=0,go=false;function genPlat(){for(let i=0;i<8;i++){plat.push({x:Math.random()*(c.width-60),y:i*75,w:60,h:15})}}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&p.x>0)p.x-=15;if(e.key==='ArrowRight'&&p.x<c.width-p.w)p.x+=15});function u(){p.v+=p.g;p.y+=p.v;if(p.y>c.height){go=true}for(let pl of plat){if(p.v>0&&p.y+p.h>=pl.y&&p.y+p.h<=pl.y+pl.h+5&&p.x+p.w>pl.x&&p.x<pl.x+pl.w){p.v=-12;s+=10}}plat=plat.filter(pl=>{if(pl.y>c.height)return false;pl.y+=2;return true});if(plat.length<8)genPlat();document.getElementById('score').textContent=s}function d(){ctx.fillStyle='#edf1f5';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#ff006e';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#118ab2';for(let pl of plat)ctx.fillRect(pl.x,pl.y,pl.w,pl.h);if(go){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText('Game Over',c.width/2,c.height/2);ctx.font='20px Arial';ctx.fillText('Score: '+s,c.width/2,c.height/2+40)}}function gl(){if(!go)u();d();requestAnimationFrame(gl)}genPlat();gl();</script></body></html>
