<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doodle Jump</title><style>body{font-family:Arial;text-align:center;background:#87ceeb;color:#fff;padding:20px}#game{position:relative;width:300px;height:600px;margin:20px auto;background:#87ceeb;border:2px solid #333;overflow:hidden}#player{position:absolute;width:30px;height:30px;background:#00f;border-radius:50%;left:135px;bottom:30px}#score{font-size:20px;margin:10px}button{padding:10px;margin:10px;background:#ff6600;color:#fff;border:0;cursor:pointer}</style></head><body><h1>Doodle Jump</h1><div id="score">Score: 0</div><div id="game"><div id="player"></div></div><button onclick="startGame()">Start Game</button><p><a href="index.html" style="color:#64b5f6">Back</a></p><script>let score=0,playerY=500,playerX=135,velY=0;const player=document.getElementById('player');document.addEventListener('keydown',(e)=>{if(e.key==='ArrowLeft'&&playerX>0)playerX-=10;if(e.key==='ArrowRight'&&playerX<270)playerX+=10;player.style.left=playerX+'px'});function gameLoop(){velY+=0.3;playerY+=velY;player.style.bottom=playerY+'px';if(playerY<100&&velY<0){velY=10;score+=100;document.getElementById('score').textContent='Score: '+score}if(playerY>600){alert('Game Over! Score: '+score);playerY=500;velY=0;score=0}requestAnimationFrame(gameLoop)}gameLoop();</script></body></html>
