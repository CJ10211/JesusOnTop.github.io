<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brick Breaker</title><style>body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#1a1a2e;color:#fff;font-family:Arial}canvas{background:#0f3460;border:3px solid #e94560;margin:20px 0}#info{font-size:16px;margin:10px}button{padding:10px 20px;background:#e94560;border:0;cursor:pointer;border-radius:4px;color:#fff}a{color:#64b5f6}</style></head><body><h1>🧱 Brick Breaker</h1><div id="info">Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div><canvas id="c" width="480" height="600"></canvas><div><button onclick="location.reload()">Restart</button> <a href="index.html">Back</a></div><script>const c=document.getElementById('c');const ctx=c.getContext('2d');const p={x:c.width/2-40,y:c.height-20,w:80,h:12,dx:0};let b={x:c.width/2,y:c.height-40,r:8,dx:4,dy:-4};let br=[];let s=0,l=3,go=false;for(let i=0;i<3;i++)for(let j=0;j<8;j++)br.push({x:j*60,y:i*20+10,w:58,h:18,hit:false});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')p.dx=-6;if(e.key==='ArrowRight')p.dx=6});document.addEventListener('keyup',e=>{p.dx=0});function u(){p.x+=p.dx;if(p.x<0)p.x=0;if(p.x+p.w>c.width)p.x=c.width-p.w;b.x+=b.dx;b.y+=b.dy;if(b.x-b.r<0||b.x+b.r>c.width)b.dx*=-1;if(b.y-b.r<0)b.dy*=-1;if(b.y-b.r>c.height){l--;if(l<=0)go=true;else b={x:c.width/2,y:c.height-40,r:8,dx:4,dy:-4}}if(b.x>p.x&&b.x<p.x+p.w&&b.y+b.r>p.y&&b.y<p.y+p.h)b.dy*=-1;for(let bi of br){if(!bi.hit&&b.x>bi.x&&b.x<bi.x+bi.w&&b.y>bi.y&&b.y<bi.y+bi.h){bi.hit=true;b.dy*=-1;s+=10}}document.getElementById('score').textContent=s;document.getElementById('lives').textContent=l}function d(){ctx.fillStyle='#0f3460';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#e94560';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#16c784';for(let bi of br){if(!bi.hit)ctx.fillRect(bi.x,bi.y,bi.w,bi.h)}if(go){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText('Game Over',c.width/2,c.height/2);ctx.font='20px Arial';ctx.fillText('Score: '+s,c.width/2,c.height/2+40)}}function gl(){if(!go)u();d();requestAnimationFrame(gl)}gl();</script></body></html>
