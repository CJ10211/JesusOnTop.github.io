<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Block Stacker</title><style>body{margin:0;overflow:hidden;background:#000;font-family:Arial}canvas{display:block}#info{position:fixed;top:10px;left:10px;color:#fff;background:rgba(0,0,0,0.7);padding:15px;border-radius:5px;z-index:10}#controls{position:fixed;bottom:10px;right:10px;color:#fff;background:rgba(0,0,0,0.7);padding:10px;border-radius:5px;z-index:10}</style></head><body><div id="info"><h3>3D Block Stacker</h3><p>Height: <span id="height">0</span>m | Score: <span id="score">0</span></p></div><div id="controls"><p>Arrow Keys: Move | Space: Drop | ESC: Back</p></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a1a2e);const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);const light=new THREE.DirectionalLight(0xffffff,0.8);light.position.set(50,50,50);light.castShadow=true;scene.add(light);scene.add(new THREE.AmbientLight(0xffffff,0.4));const ground=new THREE.Mesh(new THREE.BoxGeometry(40,2,40),new THREE.MeshLambertMaterial({color:0x2c3e50}));ground.castShadow=true;scene.add(ground);let blocks=[],currentBlock,height=0,score=0;const colors=[0xFF6B6B,0x4ECDC4,0x45B7D1,0xFFA502,0xFF6348];function createBlock(x,z){const color=colors[Math.floor(Math.random()*colors.length)];const block=new THREE.Mesh(new THREE.BoxGeometry(6,2,6),new THREE.MeshLambertMaterial({color:color}));block.position.set(x,height+1,z);block.castShadow=true;block.receiveShadow=true;block.velocity={x:0,z:0};return block}currentBlock=createBlock(0,0);scene.add(currentBlock);const keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){blocks.push(currentBlock);height+=2;score+=Math.abs(currentBlock.position.x)+Math.abs(currentBlock.position.z);currentBlock=createBlock(0,0);scene.add(currentBlock)}if(e.key==='Escape')window.location.href='index.html'});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});function update(){if(keys['arrowleft']||keys['a'])currentBlock.position.x=Math.max(-17,currentBlock.position.x-0.3);if(keys['arrowright']||keys['d'])currentBlock.position.x=Math.min(17,currentBlock.position.x+0.3);if(keys['arrowup']||keys['w'])currentBlock.position.z=Math.max(-17,currentBlock.position.z-0.3);if(keys['arrowdown']||keys['s'])currentBlock.position.z=Math.min(17,currentBlock.position.z+0.3);camera.position.x=currentBlock.position.x;camera.position.y=Math.max(15,height+15);camera.position.z=20;camera.lookAt(0,height,0);document.getElementById('height').textContent=(height/2).toFixed(1);document.getElementById('score').textContent=score}function animate(){requestAnimationFrame(animate);update();renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});</script></body></html>
