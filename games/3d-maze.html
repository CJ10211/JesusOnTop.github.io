<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Maze</title><style>body{margin:0;overflow:hidden;background:#000;font-family:Arial}canvas{display:block}#info{position:fixed;top:10px;left:10px;color:#fff;background:rgba(0,0,0,0.7);padding:15px;border-radius:5px;z-index:10}#controls{position:fixed;bottom:10px;right:10px;color:#fff;background:rgba(0,0,0,0.7);padding:10px;border-radius:5px;z-index:10;font-size:12px}a{color:#64b5f6}</style></head><body><div id="info"><h3>3D Maze Runner</h3><p>Score: <span id="score">0</span></p></div><div id="controls"><p>Arrow Keys: Move | Space: Jump | ESC: Back</p></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);const light=new THREE.DirectionalLight(0xffffff,1);light.position.set(50,50,50);light.castShadow=true;light.shadow.mapSize.width=2048;light.shadow.mapSize.height=2048;scene.add(light);scene.add(new THREE.AmbientLight(0xffffff,0.5));const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshLambertMaterial({color:0x90EE90}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const walls=[];function createWall(x,z,w,h){const wall=new THREE.Mesh(new THREE.BoxGeometry(w,h,5),new THREE.MeshLambertMaterial({color:0x8B4513}));wall.position.set(x,h/2,z);wall.castShadow=true;wall.receiveShadow=true;scene.add(wall);walls.push(wall)}createWall(0,0,200,5);createWall(0,100,200,5);createWall(0,-100,200,5);createWall(100,0,5,200);createWall(-100,0,5,200);createWall(30,30,60,5);createWall(-30,-30,60,5);createWall(60,-40,5,60);const player={x:0,y:5,z:-80,vx:0,vz:0,vy:0,speed:0.3,jumpPower:0.8,onGround:false};camera.position.set(player.x,player.y+5,player.z+10);const goal=new THREE.Mesh(new THREE.SphereGeometry(5,32,32),new THREE.MeshLambertMaterial({color:0xFFD700,emissive:0xFFD700}));goal.position.set(0,5,80);goal.castShadow=true;scene.add(goal);let score=0;const keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape')window.location.href='index.html'});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});function update(){if(keys['arrowup']||keys['w'])player.z+=player.speed;if(keys['arrowdown']||keys['s'])player.z-=player.speed;if(keys['arrowleft']||keys['a'])player.x-=player.speed;if(keys['arrowright']||keys['d'])player.x+=player.speed;if(keys[' ']&&player.onGround)player.vy=player.jumpPower;player.vy-=0.05;player.y+=player.vy;player.onGround=false;for(let wall of walls){const dx=Math.max(Math.abs(player.x-wall.position.x)-12.5,0);const dz=Math.max(Math.abs(player.z-wall.position.z)-2.5,0);const dy=Math.max(Math.abs(player.y-wall.position.y)-2.5,0);if(dx*dx+dz*dz+dy*dy<100){player.vy=0;player.onGround=true}}if(player.y<5){player.y=5;player.vy=0;player.onGround=true}if(Math.hypot(player.x-goal.position.x,player.z-goal.position.z)<10){score+=100;goal.position.x=Math.random()*180-90;goal.position.z=Math.random()*180-90}camera.position.x=player.x;camera.position.y=player.y+5;camera.position.z=player.z+10;camera.lookAt(player.x,player.y,player.z);document.getElementById('score').textContent=score}function animate(){requestAnimationFrame(animate);update();renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});</script></body></html>
