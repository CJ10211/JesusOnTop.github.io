<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Golf</title><style>body{margin:0;padding:20px;background:#1a4d2e;color:#fff;font-family:Arial;text-align:center}canvas{background:#2d6a4f;border:3px solid #ffd60a;display:block;margin:20px auto}#info{font-size:18px;margin:10px}button{padding:10px 20px;background:#ffd60a;color:#000;border:0;cursor:pointer;border-radius:4px}a{color:#a8dadc}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px"><rect rx="8" width="64" height="64" fill="#fff"/><circle cx="20" cy="32" r="10" fill="#0b6fbf"/><path d="M34 20h10v24H34z" fill="#0b88e0"/></svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<h1>⛳ Mini Golf</h1><div id="info">Score: <span id="score">0</span> | Level: <span id="level">1</span></div><canvas id="c" width="400" height="600"></canvas><div><button onclick="location.reload()">Restart</button> <a href="index.html">Back</a></div><script>const c=document.getElementById('c');const ctx=c.getContext('2d');const b={x:50,y:550,r:8};const h={x:350,y:50,r:12};let v={x:0,y:0};let s=0,l=1;let click=true;c.addEventListener('click',e=>{if(!click)return;const r=c.getBoundingClientRect();const mx=e.clientX-r.left;const my=e.clientY-r.top;const a=Math.atan2(my-b.y,mx-b.x);const d=Math.min(Math.hypot(mx-b.x,my-b.y)/20,15);v.x=Math.cos(a)*d;v.y=Math.sin(a)*d;click=false});function u(){b.x+=v.x;b.y+=v.y;v.x*=0.98;v.y*=0.98;if(b.x<b.r){b.x=b.r;v.x*=-0.8}if(b.x>c.width-b.r){b.x=c.width-b.r;v.x*=-0.8}if(b.y<b.r){b.y=b.r;v.y*=-0.8}if(b.y>c.height-b.r){b.y=c.height-b.r;v.y=-0.8}if(Math.hypot(b.x-h.x,b.y-h.y)<b.r+h.r){s+=100;l++;b.x=50;b.y=550;v.x=0;v.y=0;click=true}document.getElementById('score').textContent=s;document.getElementById('level').textContent=l}function d(){ctx.fillStyle='#2d6a4f';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd60a';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}function gl(){u();d();requestAnimationFrame(gl)}gl();</script></body></html>
