<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Marble Maze</title><style>body{margin:0;overflow:hidden;background:#000;font-family:Arial}canvas{display:block}#info{position:fixed;top:10px;left:10px;color:#fff;background:rgba(0,0,0,0.7);padding:15px;border-radius:5px;z-index:10}</style></head><body><div id="info"><h3>3D Marble Maze</h3><p>Time: <span id="time">0</span>s | Level: <span id="level">1</span></p></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const scene=new THREE.Scene();scene.background=new THREE.Color(0x1a1a1a);const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);const light=new THREE.DirectionalLight(0xffffff,0.8);light.position.set(50,50,50);light.castShadow=true;light.shadow.mapSize.width=2048;light.shadow.mapSize.height=2048;scene.add(light);scene.add(new THREE.AmbientLight(0xffffff,0.4));const marble=new THREE.Mesh(new THREE.SphereGeometry(1.5,32,32),new THREE.MeshLambertMaterial({color:0xFF6B6B}));marble.position.set(0,1.5,0);marble.castShadow=true;marble.receiveShadow=true;marble.physics={vel:{x:0,y:0,z:0}};scene.add(marble);const floor=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshLambertMaterial({color:0x333333}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const walls=[];function addWall(x,z,w,h){const wall=new THREE.Mesh(new THREE.BoxGeometry(w,h,2),new THREE.MeshLambertMaterial({color:0x666666}));wall.position.set(x,h/2,z);wall.castShadow=true;wall.receiveShadow=true;scene.add(wall);walls.push(wall)}addWall(0,15,50,1);addWall(0,-15,50,1);addWall(15,0,1,50);addWall(-15,0,1,50);addWall(5,5,20,1);addWall(-5,-5,20,1);const goal=new THREE.Mesh(new THREE.SphereGeometry(2,32,32),new THREE.MeshLambertMaterial({color:0xFFD700,emissive:0xFFD700}));goal.position.set(12,0.5,-12);goal.receiveShadow=true;scene.add(goal);let time=0,gameTime=setInterval(()=>{time++;document.getElementById('time').textContent=time},1000);const keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape')window.location.href='index.html'});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});function update(){const g=0.02;marble.physics.vel.y-=g;marble.position.x+=marble.physics.vel.x;marble.position.y+=marble.physics.vel.y;marble.position.z+=marble.physics.vel.z;marble.physics.vel.x*=0.95;marble.physics.vel.z*=0.95;if(keys['arrowleft']||keys['a'])marble.physics.vel.x-=0.15;if(keys['arrowright']||keys['d'])marble.physics.vel.x+=0.15;if(keys['arrowup']||keys['w'])marble.physics.vel.z-=0.15;if(keys['arrowdown']||keys['s'])marble.physics.vel.z+=0.15;if(marble.position.y<1.5){marble.position.y=1.5;marble.physics.vel.y=0}for(let wall of walls){const closestX=Math.max(-wall.geometry.parameters.width/2,Math.min(marble.position.x-wall.position.x,wall.geometry.parameters.width/2))+wall.position.x;const closestZ=Math.max(-wall.geometry.parameters.depth/2,Math.min(marble.position.z-wall.position.z,wall.geometry.parameters.depth/2))+wall.position.z;const dist=Math.hypot(marble.position.x-closestX,marble.position.z-closestZ);if(dist<marble.geometry.parameters.radius){marble.physics.vel.x*=-0.5;marble.physics.vel.z*=-0.5}}if(Math.hypot(marble.position.x-goal.position.x,marble.position.z-goal.position.z)<3.5){alert('Level Complete in '+time+'s!');clearInterval(gameTime);window.location.href='index.html'}camera.position.x=marble.position.x;camera.position.y=marble.position.y+15;camera.position.z=marble.position.z+20;camera.lookAt(marble.position.x,marble.position.y,marble.position.z)}function animate(){requestAnimationFrame(animate);update();renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});</script></body></html>
