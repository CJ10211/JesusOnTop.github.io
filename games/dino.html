<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dino Runner</title><style>body{margin:0;padding:0;background:#f7f7f7;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}#gameContainer{text-align:center}canvas{background:linear-gradient(180deg,#f7f7f7 0%,#ffffff 100%);display:block;border:3px solid #333;box-shadow:0 8px 16px rgba(0,0,0,0.2)}h1{color:#333;margin:10px 0}#score{font-size:20px;color:#333}button{padding:10px 20px;background:#333;color:#fff;border:none;border-radius:5px;cursor:pointer;margin:5px}a{color:#333;text-decoration:none;margin:0 10px}</style></head><body><div id="gameContainer"><h1>🦖 Dino Runner</h1><div id="score">Score: 0</div><canvas id="gameCanvas" width="800" height="200"></canvas><div><button onclick="location.reload()">Restart</button><a href="index.html">Back</a></div></div><script>const canvas=document.getElementById('gameCanvas');const ctx=canvas.getContext('2d');const dino={x:50,y:120,w:40,h:60,velocityY:0,gravity:0.8,jumpPower:-15};let obstacles=[],score=0,gameOver=false,isJumping=false;function drawDino(){ctx.fillStyle='#333';ctx.fillRect(dino.x,dino.y,dino.w,dino.h);ctx.fillRect(dino.x+10,dino.y-20,20,20);ctx.fillStyle='#000';ctx.beginPath();ctx.arc(dino.x+15,dino.y-15,4,0,Math.PI*2);ctx.fill()}function drawGround(){ctx.fillStyle='#999';ctx.fillRect(0,160,canvas.width,10);ctx.strokeStyle='#666';ctx.lineWidth=1;for(let i=0;i<canvas.width;i+=40){ctx.beginPath();ctx.moveTo(i,160);ctx.lineTo(i+20,160);ctx.stroke()}}function drawObstacles(){ctx.fillStyle='#c00';obstacles.forEach(obs=>{ctx.fillRect(obs.x,obs.y,obs.w,obs.h);ctx.strokeStyle='#a00';ctx.lineWidth=2;ctx.strokeRect(obs.x,obs.y,obs.w,obs.h)})}function update(){dino.velocityY+=dino.gravity;dino.y+=dino.velocityY;if(dino.y+dino.h>=160){dino.y=160-dino.h;dino.velocityY=0;isJumping=false}if(Math.random()<0.01)obstacles.push({x:canvas.width,y:130,w:30,h:30});obstacles.forEach(obs=>{obs.x-=8;if(obs.x+obs.w<dino.x&&!obs.scored){obs.scored=true;score+=1}if(dino.x<obs.x+obs.w&&dino.x+dino.w>obs.x&&dino.y<obs.y+obs.h&&dino.y+dino.h>obs.y){gameOver=true}});obstacles=obstacles.filter(o=>o.x>-50)}function draw(){ctx.fillStyle='#f7f7f7';ctx.fillRect(0,0,canvas.width,canvas.height);drawGround();drawObstacles();drawDino();ctx.fillStyle='#333';ctx.font='20px Arial';ctx.fillText('Score: '+score,10,30);if(gameOver){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.font='bold 36px Arial';ctx.textAlign='center';ctx.fillText('GAME OVER',canvas.width/2,canvas.height/2-30);ctx.font='20px Arial';ctx.fillText('Score: '+score,canvas.width/2,canvas.height/2+30)}}function gameLoop(){if(!gameOver)update();draw();requestAnimationFrame(gameLoop)}canvas.addEventListener('click',()=>{if(!isJumping){dino.velocityY=dino.jumpPower;isJumping=true}});document.addEventListener('keydown',e=>{if(e.code==='Space'&&!isJumping){e.preventDefault();dino.velocityY=dino.jumpPower;isJumping=true}});gameLoop();</script></body></html>
