<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piano Tiles</title><style>body{font-family:Arial;text-align:center;background:#000;color:#fff;padding:20px}#game{position:relative;width:400px;height:600px;margin:20px auto;background:#111;border:2px solid #fff;overflow:hidden}#score{font-size:24px;margin:20px}#tiles{position:absolute;width:100%;height:100%}#tiles div{position:absolute;width:100px;height:80px;background:#222;border:1px solid #666;cursor:pointer}button{padding:10px;margin:10px;background:#0366d6;color:#fff;border:0;cursor:pointer}</style></head><body><h1>Piano Tiles</h1><div id="score">Score: 0</div><div id="game"><div id="tiles"></div></div><button onclick="startGame()">Start</button><p><a href="index.html" style="color:#64b5f6">Back</a></p><script>let score=0,gameRunning=false,tileId=0;const game=document.getElementById('game');const tiles=document.getElementById('tiles');function startGame(){score=0;tileId=0;tiles.innerHTML='';gameRunning=true;spawnTile()}function spawnTile(){if(!gameRunning)return;const t=document.createElement('div');t.id='tile'+tileId++;t.style.left=Math.random()*(400-100)+'px';t.style.top='-80px';t.onclick=()=>{t.remove();score+=10;document.getElementById('score').textContent='Score: '+score};tiles.appendChild(t);let y=-80;const interval=setInterval(()=>{y+=5;t.style.top=y+'px';if(y>600){clearInterval(interval);t.remove();gameRunning=false;alert('Game Over! Score: '+score)}},30);setTimeout(spawnTile,500)}startGame();</script></body></html>
