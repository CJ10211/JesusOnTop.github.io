<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piano Tiles</title><style>body{font-family:Arial;text-align:center;background:#000;color:#fff;padding:20px}#game{position:relative;width:400px;height:600px;margin:20px auto;background:#111;border:2px solid #fff;overflow:hidden}#score{font-size:24px;margin:20px}#tiles{position:absolute;width:100%;height:100%}#tiles div{position:absolute;width:100px;height:80px;background:#222;border:1px solid #666;cursor:pointer}button{padding:10px;margin:10px;background:#0366d6;color:#fff;border:0;cursor:pointer}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px">
  <rect rx="8" width="64" height="64" fill="#fff"/>
  <rect x="28" y="8" width="8" height="48" fill="#0b6fbf"/>
  <rect x="12" y="28" width="40" height="8" fill="#0b6fbf"/>
</svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<h1>Piano Tiles</h1><div id="score">Score: 0</div><div id="game"><div id="tiles"></div></div><button onclick="startGame()">Start</button><p><a href="index.html" style="color:#64b5f6">Back</a></p><script>let score=0,gameRunning=false,tileId=0;const game=document.getElementById('game');const tiles=document.getElementById('tiles');function startGame(){score=0;tileId=0;tiles.innerHTML='';gameRunning=true;spawnTile()}function spawnTile(){if(!gameRunning)return;const t=document.createElement('div');t.id='tile'+tileId++;t.style.left=Math.random()*(400-100)+'px';t.style.top='-80px';t.onclick=()=>{t.remove();score+=10;document.getElementById('score').textContent='Score: '+score};tiles.appendChild(t);let y=-80;const interval=setInterval(()=>{y+=5;t.style.top=y+'px';if(y>600){clearInterval(interval);t.remove();gameRunning=false;alert('Game Over! Score: '+score)}},30);setTimeout(spawnTile,500)}startGame();</script></body></html>
