<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tunnel Run</title><style>body{margin:0;padding:20px;background:#0a0e27;color:#fff;font-family:Arial;text-align:center}canvas{background:#1a1f3a;border:3px solid #00ff88;display:block;margin:20px auto}#info{font-size:18px;margin:10px}button{padding:10px 20px;background:#00ff88;color:#000;border:0;cursor:pointer;border-radius:4px}a{color:#00ff88}</style></head><body><h1>🌀 Tunnel Run</h1><div id="info">Score: <span id="score">0</span></div><canvas id="c" width="400" height="600"></canvas><div><button onclick="location.reload()">Restart</button> <a href="index.html">Back</a></div><script>const c=document.getElementById('c');const ctx=c.getContext('2d');const p={x:c.width/2-10,y:c.height-30,w:20,h:20};let obs=[];let s=0,go=false;for(let i=0;i<5;i++)obs.push({x:c.width/2-40,y:-i*100,w:80,h:30,gap:60});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&p.x>0)p.x-=20;if(e.key==='ArrowRight'&&p.x<c.width-p.w)p.x+=20});function u(){for(let o of obs){o.y+=5;if(o.y>c.height){o.y=-100;s+=10}}if(obs[0].y>0&&obs[0].y<30){const lr=c.width/2-obs[0].gap/2;const rr=c.width/2+obs[0].gap/2;if(p.x<lr||p.x+p.w>rr)go=true}if(p.y<0)go=true;document.getElementById('score').textContent=s}function d(){ctx.fillStyle='#1a1f3a';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#00ff88';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.strokeStyle='#00ff88';ctx.lineWidth=3;for(let o of obs){const lr=c.width/2-o.gap/2;const rr=c.width/2+o.gap/2;ctx.fillStyle='#ff0055';ctx.fillRect(0,o.y,lr,o.h);ctx.fillRect(rr,o.y,c.width-rr,o.h)}if(go){ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText('Game Over',c.width/2,c.height/2);ctx.font='20px Arial';ctx.fillText('Score: '+s,c.width/2,c.height/2+40)}}function gl(){if(!go)u();d();requestAnimationFrame(gl)}gl();</script></body></html>
