<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tappy Bird</title><style>body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#87ceeb;color:#333;font-family:Arial}canvas{background:#87ceeb;border:3px solid #333;margin:20px}#info{font-size:18px}button{padding:10px 20px;background:#333;color:#87ceeb;border:0;cursor:pointer;border-radius:4px}a{color:#333}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px"><rect rx="8" width="64" height="64" fill="#fff"/><circle cx="20" cy="32" r="10" fill="#0b6fbf"/><path d="M34 20h10v24H34z" fill="#0b88e0"/></svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<h1>🐦 Tappy Bird</h1><div id="info">Score: <span id="score">0</span></div><canvas id="c" width="320" height="480"></canvas><div><button onclick="location.reload()">Restart</button> <a href="index.html">Back</a></div><script>const c=document.getElementById('c');const ctx=c.getContext('2d');const b={x:60,y:240,r:12,v:0,g:0.6};let pipes=[];let s=0,go=false;function spawnPipe(){const gap=100;const t=Math.random()*(c.height-gap-100)+50;pipes.push({x:c.width,t:t,h:gap,w:80})}c.addEventListener('click',()=>{b.v=-10});c.addEventListener('touchstart',()=>{b.v=-10});function u(){b.v+=b.g;b.y+=b.v;if(b.y-b.r<0||b.y+b.r>c.height)go=true;if(Math.random()<0.01)spawnPipe();pipes.forEach(p=>{p.x-=5;if(b.x+b.r>p.x&&b.x-b.r<p.x+p.w){if(b.y-b.r<p.t||b.y+b.r>p.t+p.h)go=true;else s+=1}});pipes=pipes.filter(p=>p.x>-100);document.getElementById('score').textContent=s}function d(){ctx.fillStyle='#87ceeb';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#ffff00';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#228b22';for(let p of pipes){ctx.fillRect(p.x,0,p.w,p.t);ctx.fillRect(p.x,p.t+p.h,p.w,c.height-p.t-p.h)}if(go){ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='bold 28px Arial';ctx.textAlign='center';ctx.fillText('Game Over',c.width/2,c.height/2);ctx.font='18px Arial';ctx.fillText('Score: '+s,c.width/2,c.height/2+40)}}function gl(){if(!go)u();d();requestAnimationFrame(gl)}gl();</script></body></html>
