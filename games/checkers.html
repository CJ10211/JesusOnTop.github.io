<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkers</title><style>body{font-family:Arial;text-align:center;background:#333;color:#fff;padding:20px}#board{display:inline-grid;grid-template-columns:repeat(8,50px);gap:0;background:#000;margin:20px}#board div{width:50px;height:50px;border:1px solid #666}#board div.dark{background:#333}#board div.light{background:#ccc}#board div.red{background:#ff0000}#board div.black{background:#000}button{padding:10px;margin:10px;background:#0366d6;color:#fff;border:0;cursor:pointer}</style></head><body><h1>Checkers (Demo)</h1><p>Click squares to move pieces</p><div id="board"></div><button onclick="initGame()">New Game</button><p><a href="index.html" style="color:#64b5f6">Back</a></p><script>let board=[];function initGame(){board=Array(64).fill(0);for(let i=0;i<24;i++)board[i]=1;for(let i=40;i<64;i++)board[i]=2;drawBoard()}function drawBoard(){const b=document.getElementById('board');b.innerHTML='';for(let i=0;i<64;i++){const div=document.createElement('div');div.className=((i/8|0)+i%8)%2===0?'dark':'light';if(board[i]===1)div.className+=' red';if(board[i]===2)div.className+=' black';div.onclick=()=>alert('Position: '+i);b.appendChild(div)}}initGame();</script></body></html>
