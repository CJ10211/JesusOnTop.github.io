<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D City Flyer</title><style>body{margin:0;overflow:hidden;background:#000;font-family:Arial}canvas{display:block}#info{position:fixed;top:10px;left:10px;color:#fff;background:rgba(0,0,0,0.7);padding:15px;border-radius:5px;z-index:10}#controls{position:fixed;bottom:10px;right:10px;color:#fff;background:rgba(0,0,0,0.7);padding:10px;border-radius:5px;font-size:12px}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px"><rect rx="8" width="64" height="64" fill="#fff"/><circle cx="20" cy="32" r="10" fill="#0b6fbf"/><path d="M34 20h10v24H34z" fill="#0b88e0"/></svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<div id="info"><h3>3D City Flyer</h3><p>Altitude: <span id="alt">100</span>m | Speed: <span id="spd">0</span></p></div><div id="controls"><p>Arrow Keys: Fly | W/S: Altitude | ESC: Back</p></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x87ceeb,500,1000);scene.background=new THREE.Color(0x87ceeb);const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,2000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);const light=new THREE.DirectionalLight(0xffffff,0.8);light.position.set(100,200,100);light.castShadow=true;scene.add(light);scene.add(new THREE.AmbientLight(0xffffff,0.4));const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshLambertMaterial({color:0x7CB342}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);for(let x=-200;x<=200;x+=40){for(let z=-200;z<=200;z+=40){const h=Math.random()*80+40;const building=new THREE.Mesh(new THREE.BoxGeometry(30,h,30),new THREE.MeshLambertMaterial({color:0x888888}));building.position.set(x,h/2,z);building.castShadow=true;building.receiveShadow=true;scene.add(building)}}const player={x:0,y:100,z:0,vel:{x:0,y:0,z:0}};camera.position.set(player.x,player.y,player.z+30);const keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape')window.location.href='index.html'});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});function update(){if(keys['arrowleft']||keys['a'])player.vel.x=Math.max(-0.5,player.vel.x-0.02);if(keys['arrowright']||keys['d'])player.vel.x=Math.min(0.5,player.vel.x+0.02);if(keys['arrowup']||keys['w'])player.vel.z=Math.max(-0.5,player.vel.z-0.02);if(keys['arrowdown']||keys['s'])player.vel.z=Math.min(0.5,player.vel.z+0.02);if(keys['w'])player.y=Math.min(200,player.y+0.5);if(keys['s'])player.y=Math.max(20,player.y-0.5);player.vel.x*=0.9;player.vel.z*=0.9;player.x+=player.vel.x;player.z+=player.vel.z;if(player.y<20)player.y=20;camera.position.x=player.x;camera.position.y=player.y;camera.position.z=player.z+40;camera.lookAt(player.x,player.y,player.z);document.getElementById('alt').textContent=player.y.toFixed(0);document.getElementById('spd').textContent=(Math.hypot(player.vel.x,player.vel.z)*2).toFixed(1)}function animate(){requestAnimationFrame(animate);update();renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});</script></body></html>
