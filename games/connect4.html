<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Four</title><style>body{font-family:Arial;text-align:center;background:#1e3a5f;color:#fff;padding:20px}#board{display:inline-grid;grid-template-columns:repeat(7,60px);gap:5px;background:#1e3a5f;padding:10px;margin:20px auto}#board div{width:60px;height:60px;border-radius:50%;background:#333;cursor:pointer;border:2px solid #666}#board div.red{background:#ff0000}#board div.yellow{background:#ffff00}button{padding:10px;margin:10px;background:#ffd700;color:#000;border:0;cursor:pointer;font-weight:bold}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px"><rect rx="8" width="64" height="64" fill="#fff"/><circle cx="20" cy="32" r="10" fill="#0b6fbf"/><path d="M34 20h10v24H34z" fill="#0b88e0"/></svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<h1>Connect Four</h1><p>Click columns to drop your piece (Yellow)</p><div id="board"></div><button onclick="initGame()">New Game</button><p><a href="index.html" style="color:#64b5f6">Back</a></p><script>let board=[],gameActive=true;function initGame(){board=Array(42).fill(0);gameActive=true;drawBoard()}function drawBoard(){const b=document.getElementById('board');b.innerHTML='';for(let i=0;i<42;i++){const div=document.createElement('div');if(board[i]===1)div.className='yellow';else if(board[i]===2)div.className='red';div.onclick=()=>dropPiece(i%7);b.appendChild(div)}}function dropPiece(col){if(!gameActive)return;for(let r=5;r>=0;r--){const idx=r*7+col;if(board[idx]===0){board[idx]=1;if(checkWin(1)){alert('You win!');gameActive=false}else{setTimeout(aiMove,500)}drawBoard();return}}}function aiMove(){for(let col=0;col<7;col++){for(let r=5;r>=0;r--){const idx=r*7+col;if(board[idx]===0){board[idx]=2;if(checkWin(2)){alert('AI wins!')}gameActive=false;drawBoard();return}}}gameActive=false;}function checkWin(p){for(let i=0;i<42;i++){if(board[i]===p){if(i+1<42&&board[i+1]===p&&board[i+2]===p&&board[i+3]===p)return true}}return false}initGame();</script></body></html>
