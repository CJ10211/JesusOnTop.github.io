<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Ball Roller</title><style>body{margin:0;overflow:hidden;background:#000;font-family:Arial}canvas{display:block}#info{position:fixed;top:10px;left:10px;color:#fff;background:rgba(0,0,0,0.7);padding:15px;border-radius:5px;z-index:10}#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;background:rgba(0,0,0,0.8);padding:20px;border-radius:10px;text-align:center;z-index:20;display:none}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px"><rect rx="8" width="64" height="64" fill="#fff"/><circle cx="20" cy="32" r="10" fill="#0b6fbf"/><path d="M34 20h10v24H34z" fill="#0b88e0"/></svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<div id="info"><h3>3D Ball Roller</h3><p>Distance: <span id="dist">0</span>m | Speed: <span id="speed">0</span></p></div><div id="msg"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);const light=new THREE.DirectionalLight(0xffffff,0.8);light.position.set(0,50,0);light.castShadow=true;scene.add(light);scene.add(new THREE.AmbientLight(0xffffff,0.4));const ground=new THREE.Mesh(new THREE.BoxGeometry(30,2,200),new THREE.MeshLambertMaterial({color:0x90EE90}));ground.castShadow=true;ground.receiveShadow=true;scene.add(ground);const ball=new THREE.Mesh(new THREE.SphereGeometry(2,32,32),new THREE.MeshLambertMaterial({color:0xFF6B6B}));ball.position.set(0,4,0);ball.castShadow=true;ball.receiveShadow=true;scene.add(ball);let ballVel={x:0,y:0,z:0.5},distance=0,gameActive=true;const obstacles=[];for(let i=0;i<15;i++){const obs=new THREE.Mesh(new THREE.BoxGeometry(25,1,3),new THREE.MeshLambertMaterial({color:0xFFD700}));obs.position.set(0,3,i*15-100);obs.castShadow=true;scene.add(obs);obstacles.push(obs)}const keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape')window.location.href='index.html'});window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});function update(){if(!gameActive)return;if(keys['arrowleft']||keys['a'])ballVel.x=Math.max(-0.3,ballVel.x-0.02);if(keys['arrowright']||keys['d'])ballVel.x=Math.min(0.3,ballVel.x+0.02);ballVel.x*=0.98;ball.position.x+=ballVel.x;ballVel.z=0.5;ball.position.z+=ballVel.z;distance+=0.5;if(ball.position.x<-14||ball.position.x>14){showMsg('You fell off!');gameActive=false}camera.position.x=ball.position.x;camera.position.y=ball.position.y+8;camera.position.z=ball.position.z+15;camera.lookAt(ball.position.x,ball.position.y,ball.position.z);document.getElementById('dist').textContent=distance.toFixed(0);document.getElementById('speed').textContent=ballVel.z.toFixed(1)}function showMsg(text){const msg=document.getElementById('msg');msg.innerHTML=text+'<br><button onclick="location.reload()" style="padding:10px 20px;margin-top:10px;background:#64b5f6;border:none;border-radius:5px;cursor:pointer;color:#fff">Restart</button><br><a href="index.html" style="color:#64b5f6;text-decoration:none;margin-top:10px;display:block">Back to Games</a>';msg.style.display='block'}function animate(){requestAnimationFrame(animate);update();renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});</script></body></html>
