<h1>💎 Match Gems</h1><div id="info">Score: <span id="score">0</span></div><canvas id="c" width="320" height="400"></canvas><div><button onclick="location.reload()">Restart</button> <a href="index.html">Back</a></div><script>const c=document.getElementById('c');const ctx=c.getContext('2d');const cols=['#ff3333','#33ff33','#3333ff','#ffff33','#ff33ff'];const gs=8;const ts=40;let grid=[];let s=0,sel=null;function initGrid(){grid=[];for(let i=0;i<gs;i++){grid[i]=[];for(let j=0;j<gs;j++){grid[i][j]=cols[Math.floor(Math.random()*cols.length)]}}}function drawGrid(){for(let i=0;i<gs;i++){for(let j=0;j<gs;j++){ctx.fillStyle=grid[i][j];ctx.fillRect(j*ts,i*ts,ts-2,ts-2);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(j*ts,i*ts,ts-2,ts-2)}}}function checkMatch(){let matched=new Set();for(let i=0;i<gs;i++){for(let j=0;j<gs-2;j++){if(grid[i][j]===grid[i][j+1]&&grid[i][j]===grid[i][j+2]){matched.add(i*gs+j);matched.add(i*gs+j+1);matched.add(i*gs+j+2)}}}for(let j=0;j<gs;j++){for(let i=0;i<gs-2;i++){if(grid[i][j]===grid[i+1][j]&&grid[i][j]===grid[i+2][j]){matched.add(i*gs+j);matched.add((i+1)*gs+j);matched.add((i+2)*gs+j)}}}if(matched.size>0){matched.forEach(pos=>{const i=Math.floor(pos/gs);const j=pos%gs;grid[i][j]=null});s+=matched.size*10;dropGems();return true}return false}function dropGems(){for(let j=0;j<gs;j++){for(let i=gs-1;i>=0;i--){if(grid[i][j]===null){for(let k=i-1;k>=0;k--){if(grid[k][j]!==null){grid[i][j]=grid[k][j];grid[k][j]=null;break}}}}}for(let i=0;i<gs;i++){for(let j=0;j<gs;j++){if(grid[i][j]===null){grid[i][j]=cols[Math.floor(Math.random()*cols.length)]}}}}c.addEventListener('click',e=>{const r=c.getBoundingClientRect();const mx=(e.clientX-r.left)/ts|0;const my=(e.clientY-r.top)/ts|0;if(sel===null){sel={x:mx,y:my}}else{if(Math.abs(sel.x-mx)+Math.abs(sel.y-my)===1){const t=grid[sel.y][sel.x];grid[sel.y][sel.x]=grid[my][mx];grid[my][mx]=t;if(!checkMatch()){const t=grid[sel.y][sel.x];grid[sel.y][sel.x]=grid[my][mx];grid[my][mx]=t}}sel=null}});function u(){checkMatch();document.getElementById('score').textContent=s}function d(){ctx.fillStyle='#636e72';ctx.fillRect(0,0,c.width,c.height);drawGrid()}function gl(){u();d();requestAnimationFrame(gl)}initGrid();gl();</script></body></html>
