<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airship</title><style>body{margin:0;padding:20px;background:#87ceeb;color:#333;font-family:Arial;text-align:center}canvas{background:#87ceeb;border:3px solid #ff6b6b;display:block;margin:20px auto}#info{font-size:18px;margin:10px}button{padding:10px 20px;background:#ff6b6b;color:#fff;border:0;cursor:pointer;border-radius:4px}a{color:#ff6b6b}</style></head><body>

<header class="site-header" style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(90deg,#0b6fbf,#0b88e0);color:#fff">
  <div style="display:flex;align-items:center;gap:10px">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:36px;height:36px">
  <rect rx="8" width="64" height="64" fill="#fff"/>
  <rect x="28" y="8" width="8" height="48" fill="#0b6fbf"/>
  <rect x="12" y="28" width="40" height="8" fill="#0b6fbf"/>
</svg>
    <div style="font-weight:700">JesusOnTop Games</div>
  </div>
  <nav style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <a href="../index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Home</a>
    <a href="index.html" style="background:rgba(255,255,255,0.95);color:#08324a;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:700">Games Hub</a>
  </nav>
</header>
<h1>🛩️ Airship</h1><div id="info">Score: <span id="score">0</span></div><canvas id="c" width="400" height="600"></canvas><div><button onclick="location.reload()">Restart</button> <a href="index.html">Back</a></div><script>const c=document.getElementById('c');const ctx=c.getContext('2d');const p={x:175,y:500,w:50,h:40};let obs=[];let s=0,go=false;document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&p.x>0)p.x-=12;if(e.key==='ArrowRight'&&p.x<c.width-p.w)p.x+=12});function u(){if(Math.random()<0.015)obs.push({x:Math.random()*(c.width-40),y:-40,w:40,h:40});for(let o of obs){o.y+=7;if(p.y<o.y+o.h&&p.y+p.h>o.y&&p.x<o.x+o.w&&p.x+p.w>o.x)go=true}obs=obs.filter(o=>o.y<c.height);s=Math.floor(s+0.15);document.getElementById('score').textContent=Math.floor(s)}function d(){ctx.fillStyle='#87ceeb';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#ff6b6b';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#333';for(let o of obs){ctx.beginPath();ctx.arc(o.x+o.w/2,o.y+o.h/2,o.w/2,0,Math.PI*2);ctx.fill()}if(go){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText('Crashed!',c.width/2,c.height/2);ctx.font='20px Arial';ctx.fillText('Score: '+Math.floor(s),c.width/2,c.height/2+40)}}function gl(){if(!go)u();d();requestAnimationFrame(gl)}gl();</script></body></html>
